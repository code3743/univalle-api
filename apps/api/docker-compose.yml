services:
  postgres:
    image: postgres:16-alpine
    container_name: api-univalle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: univalle
      POSTGRES_PASSWORD: univalle
      POSTGRES_DB: univalle_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univalle -d univalle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
